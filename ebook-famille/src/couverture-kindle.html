<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couverture Kindle</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; height: 2560px; background: #FBF7F2; position: relative; overflow: hidden;
         font-family: "DM Sans", sans-serif; color: #33251F; }
  .photo { position: absolute; left: 0; top: 0; width: 1600px; height: 1560px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
  .sticker { position: absolute; right: 120px; top: 1430px; width: 250px; height: 250px; border-radius: 50%;
             background: #F4DFDA; display: flex; align-items: center; justify-content: center; text-align: center;
             transform: rotate(-8deg); font-family: "Caveat"; font-weight: 600; font-size: 64px; line-height: .95; color: #6B4433; }
  .band { position: absolute; left: 120px; right: 120px; top: 1690px; }
  h1 { font-family: "Fraunces", serif; font-weight: 400; font-size: 210px; line-height: .95; letter-spacing: -.01em;
       font-variation-settings: "SOFT" 100, "opsz" 144; }
  h1 em { font-style: italic; color: #6B4433; }
  .sub { font-size: 62px; line-height: 1.25; margin-top: 50px; }
  .foot { position: absolute; left: 120px; right: 120px; bottom: 110px; border-top: 3px solid #E4D8CC; padding-top: 34px;
          display: flex; justify-content: space-between; font-size: 40px; color: #86736A; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="photo"><img src="../photos/recettes/tarte-fraises.jpg" alt=""></div>
  <div class="sticker">100<br>recettes</div>
  <div class="band">
    <h1>Mes recettes<br><em>de pâtisserie</em></h1>
    <p class="sub">100 gâteaux simples et gourmands<br>à réaliser chez soi</p>
  </div>
  <div class="foot"><span>Simples · Rapides · Gourmandes</span><span>Pour débuter et en famille</span></div>
</body>
</html>
